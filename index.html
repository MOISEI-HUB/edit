<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EDIT — Искусственный интеллект</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
background:linear-gradient(160deg,#fff,#e8edff);
color:#182454;
text-align:center;
}

.app{
max-width:430px;
min-height:100dvh;
margin:auto;
padding:35px 20px;
display:flex;
flex-direction:column;
align-items:center;
}

h1{
font-size:48px;
color:#293caa;
margin:20px 0 5px;
letter-spacing:3px;
}

.subtitle{color:#53649b}

.wave{
height:100px;
margin-top:45px;
display:flex;
align-items:center;
justify-content:center;
gap:5px;
}

.wave span{
width:6px;
height:20px;
border-radius:10px;
background:linear-gradient(#25b9ff,#8954ee);
}

.wave.active span{
animation:move 1s infinite alternate;
}

.wave span:nth-child(2n){animation-delay:.2s}
.wave span:nth-child(3n){animation-delay:.4s}

@keyframes move{
from{height:15px}
to{height:75px}
}

.mic{
margin-top:35px;
width:145px;
height:145px;
border-radius:50%;
border:5px solid #b7d9ff;
background:linear-gradient(135deg,#19bbff,#7954ed);
color:white;
font-size:60px;
box-shadow:0 0 35px #8aabff;
cursor:pointer;
}

.status{
margin-top:25px;
font-size:20px;
}

.answer{
margin-top:20px;
padding:15px;
font-size:17px;
line-height:1.5;
max-height:180px;
overflow:auto;
}

.buttons{
margin-top:auto;
display:flex;
gap:12px;
padding-top:30px;
}

.button{
border:0;
background:white;
border-radius:18px;
padding:17px;
color:#334b90;
box-shadow:0 4px 15px #d4dcf2;
}

.note{
font-size:12px;
color:#7884a7;
margin-top:20px;
}
</style>
</head>

<body>
<div class="app">

<h1>EDIT</h1>
<div class="subtitle">Искусственный интеллект</div>

<div class="wave" id="wave">
<span></span><span></span><span></span>
<span></span><span></span><span></span>
<span></span><span></span><span></span>
<span></span><span></span><span></span>
</div>

<button class="mic" onclick="toggleTalk()">🎙</button>

<div class="status" id="status">
Нажмите, чтобы начать разговор
</div>

<div class="answer" id="answer"></div>

<div class="buttons">
<button class="button" onclick="showHistory()">
💬<br>Диалог
</button>

<button class="button" onclick="showBluetooth()">
ᛒ<br>JBL
</button>

<button class="button" onclick="showSettings()">
⚙️<br>Настройки
</button>
</div>

<div class="note">EDIT 2.0 • Голосовой помощник</div>

</div>

<script>
let recognition;
let active=false;
let speaking=false;
let history=[];

const statusEl=document.getElementById("status");
const answerEl=document.getElementById("answer");
const wave=document.getElementById("wave");

const SpeechRecognition=
window.SpeechRecognition||
window.webkitSpeechRecognition;

if(SpeechRecognition){
 recognition=new SpeechRecognition();
 recognition.lang="ru-RU";
 recognition.continuous=false;
 recognition.interimResults=false;

 recognition.onresult=async function(event){
  const question=event.results[0][0].transcript;
  statusEl.innerText="Вы: "+question;
  const response = await getAnswer(question);
  history.push("Вы: "+question+"\nEDIT: "+response);
  speak(response);
 };

 recognition.onerror=function(event){
  if(!active)return;
  statusEl.innerText="Ошибка микрофона: "+event.error;
 };

 recognition.onend=function(){
  if(active&&!speaking){
   statusEl.innerText="Нажмите микрофон, чтобы продолжить";
  }
 };
}

function toggleTalk(){
 if(active){
  active=false;
  wave.classList.remove("active");
  if(recognition)recognition.abort();
  speechSynthesis.cancel();
  statusEl.innerText="Разговор завершён";
  return;
 }

 if(!recognition){
  statusEl.innerText=
  "Этот браузер не поддерживает распознавание речи.";
  return;
 }

 active=true;
 wave.classList.add("active");
 listen();
}

function listen(){
 if(!active||speaking)return;
 try{
  statusEl.innerText="Слушаю вас...";
  recognition.start();
 }catch(e){
  statusEl.innerText="Нажмите микрофон ещё раз";
 }
}

async function getAnswer(question) {
  try {
    const response = await fetch(
      "https://edit.akkermaneduard.workers.dev/chat",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
       body: JSON.stringify({
    question: question,
    message: question
})
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      return "Ошибка подключения: " +
        (data.error || response.status);
    }

    return data.answer || data.reply ||
      data.response || "Ответ не получен.";

  } catch (error) {
    return "Не удалось подключиться к искусственному интеллекту.";
  }
}
function speak(text){
 speaking=true;
 answerEl.innerText=text;
 statusEl.innerText="EDIT отвечает...";

 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="ru-RU";
 utterance.rate=0.95;

 utterance.onend=function(){
  speaking=false;
  if(active){
   statusEl.innerText="Нажмите микрофон для следующего вопроса";
  }
 };

 utterance.onerror=function(){
  speaking=false;
  statusEl.innerText="Не удалось воспроизвести ответ";
 };

 speechSynthesis.cancel();
 speechSynthesis.speak(utterance);
}

function showHistory(){
 alert(history.length?history.join("\n\n"):
 "История разговоров пока пуста.");
}

function showBluetooth(){
 alert("Подключите JBL через настройки Bluetooth iPhone.");
}

function showSettings(){
 alert("EDIT 2.0. Тестовая версия. Подписка 20 MDL пока не подключена.");
}
</script>
</body>
</html>
